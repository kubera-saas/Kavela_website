<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAVELA Healthcare - planche typographique</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Serif:wght@300;400&family=Instrument+Sans:wght@400;500&family=Instrument+Serif&family=Libre+Caslon+Display&family=Hanken+Grotesk:wght@300;400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=gambetta@300,400,500&f[]=switzer@300,400,500&f[]=sentient@300,400&f[]=satoshi@400,500&f[]=zodiak@300,400&f[]=general-sans@400,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #E9E8E4; color: #14181B; font-family: system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .intro { max-width: 1180px; margin: 0 auto; padding: 48px 24px 16px; }
  .intro h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .intro p { color: #555; line-height: 1.6; max-width: 60ch; }
  .spec { max-width: 1180px; margin: 24px auto; background: #FAFAF8; border-radius: 6px; padding: 56px 64px 60px; }
  .tag { font-family: system-ui; font-size: 12px; color: #8A8D90; display: flex; justify-content: space-between; margin-bottom: 44px; }
  .tag b { color: #14181B; font-weight: 600; font-size: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 22px; border-bottom: 1px solid #DEDDD8; margin-bottom: 64px; }
  .top img { height: 32px; }
  .top nav { display: flex; gap: 28px; font-size: 14px; color: #4A4F54; }
  h2.d { font-size: 60px; line-height: 1.06; max-width: 17ch; margin-bottom: 28px; font-weight: 400; }
  p.l { font-size: 18px; line-height: 1.6; max-width: 36rem; color: #3E4448; margin-bottom: 56px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 56px; border-top: 1px solid #14181B; }
  .grid div { padding: 22px 0; border-bottom: 1px solid #DEDDD8; display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
  .grid b { font-weight: 500; font-size: 17px; }
  .grid span { font-size: 15px; line-height: 1.55; color: #5A6064; }
  .cap { margin-top: 36px; font-size: 13px; color: #8A8D90; }
  /* Pairings */
  .p1 .d { font-family: Gambetta, serif; font-weight: 400; letter-spacing: -0.01em; }        .p1 { font-family: Switzer, sans-serif; }
  .p2 .d { font-family: Sentient, serif; font-weight: 300; letter-spacing: -0.005em; }      .p2 { font-family: Satoshi, sans-serif; }
  .p3 .d { font-family: "IBM Plex Serif", serif; font-weight: 300; letter-spacing: -0.01em; } .p3 { font-family: "IBM Plex Sans", sans-serif; }
  .p4 .d { font-family: "Libre Caslon Display", serif; font-size: 64px; letter-spacing: 0; } .p4 { font-family: "Hanken Grotesk", sans-serif; }
  .p5 .d { font-family: Switzer, sans-serif; font-weight: 400; letter-spacing: -0.02em; }    .p5 { font-family: Switzer, sans-serif; }
  .p6 .d { font-family: Zodiak, serif; font-weight: 300; letter-spacing: -0.01em; }          .p6 { font-family: "General Sans", sans-serif; }
  .p7 .d { font-family: Newsreader, serif; font-weight: 300; letter-spacing: -0.015em; }     .p7 { font-family: "Instrument Sans", sans-serif; }
  .p0 .d { font-family: "Inter Tight", Inter, sans-serif; font-weight: 300; letter-spacing: -0.03em; } .p0 { font-family: Inter, sans-serif; }
  @media (max-width: 800px) { .spec { padding: 32px 22px; } h2.d { font-size: 38px !important; } .grid { grid-template-columns: 1fr; } .grid div { grid-template-columns: 1fr; gap: 4px; } .top nav { display: none; } }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="intro">
  <h1>Planche typographique - KAVELA Healthcare</h1>
  <p>Même contenu, même logo, même mise en page sobre. Seule la police change. Toutes les polices ci-dessous sont gratuites pour un usage commercial (Google Fonts ou Fontshare). La première carte montre la police actuelle, pour comparer.</p>
</div>

<!-- Repeated specimen -->
<template id="t">
  <div class="top"><img src="/Healthcare/Eau-horizontal/kavela-healthcare-eau-horizontal-clair.svg" alt=""><nav><span>Approach</span><span>Practice areas</span><span>Ecosystem</span><span>Contact</span></nav></div>
  <h2 class="d">Market access and strategic engagement across Asian healthcare.</h2>
  <p class="l">For healthcare companies, operators and investors. Anchored in Singapore, focused on Southeast Asia, with reach into Europe and Mauritius.</p>
  <div class="grid">
    <div><b>Market access</b><span>Where an offer fits, who buys, and whether to work direct or through a local partner.</span></div>
    <div><b>Healthcare deal flow</b><span>Operators and platforms that fit a healthcare investment strategy.</span></div>
    <div><b>Partner selection</b><span>The right distributor, integrator or strategic partner in each market.</span></div>
    <div><b>Co-investor and LP access</b><span>Investors active in healthcare across the region.</span></div>
  </div>
</template>

<section class="spec p0" data-n="0" data-t="Actuelle : Inter Tight + Inter" data-c="Référence de départ. Neutre, mais vue partout."></section>
<section class="spec p1" data-n="1" data-t="Gambetta + Switzer" data-c="Serif moderne et chaleureuse, sans suisse très propre. Esprit banque privée contemporaine."></section>
<section class="spec p2" data-n="2" data-t="Sentient + Satoshi" data-c="Serif fine et éditoriale, sans géométrique douce. Esprit magazine économique haut de gamme."></section>
<section class="spec p3" data-n="3" data-t="IBM Plex Serif + IBM Plex Sans" data-c="Rigueur institutionnelle, lisibilité parfaite. Esprit think tank, rapport de recherche."></section>
<section class="spec p4" data-n="4" data-t="Libre Caslon Display + Hanken Grotesk" data-c="Serif classique de caractère. Esprit maison financière historique, très premium."></section>
<section class="spec p5" data-n="5" data-t="Switzer seule" data-c="Une seule famille, grotesque suisse raffinée. Remplace Inter en plus élégant, sans serif."></section>
<section class="spec p6" data-n="6" data-t="Zodiak + General Sans" data-c="Serif à fort contraste, sans contemporaine. Esprit luxe discret."></section>
<section class="spec p7" data-n="7" data-t="Newsreader + Instrument Sans" data-c="Serif de presse sobre, sans nette. Esprit publication de référence (type Financial Times)."></section>

<script>
  const t = document.getElementById("t");
  document.querySelectorAll(".spec").forEach((s) => {
    const head = document.createElement("div");
    head.className = "tag";
    head.innerHTML = `<b>${s.dataset.n}. ${s.dataset.t}</b><span>${s.dataset.n === "0" ? "police actuelle" : "proposition"}</span>`;
    s.append(head, t.content.cloneNode(true));
    const cap = document.createElement("p"); cap.className = "cap"; cap.textContent = s.dataset.c; s.append(cap);
  });
</script>
</body>
</html>
