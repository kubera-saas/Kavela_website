<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">KAVELA Healthcare</title>
  <desc id="desc">Kavela Healthcare lockup: official Kavela mark with a clinical mint healthcare accent.</desc>
  <defs>
    <filter id="navy-wordmark" color-interpolation-filters="sRGB">
      <feFlood flood-color="#0E2431" result="navy"/>
      <feComposite in="navy" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>

  <!-- Healthcare accent: the official favicon sits on a soft clinical-mint offset tile. -->
  <rect x="38" y="90" width="250" height="250" rx="68" fill="#DDF4F0"/>
  <g transform="translate(0 130) scale(7.5)">
    <rect width="32" height="32" rx="7.5" fill="#0E2431"/>
    <rect x="8.5" y="8" width="3.5" height="16" rx="1.75" fill="#F7F4EC"/>
    <path d="M14.6 8L21.6 16L14.6 24" stroke="#F7F4EC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Official wordmark: embedded and recoloured, preserving the original letterforms exactly. -->
  <svg x="380" y="94" width="820" height="133" viewBox="211 337 780 127" overflow="hidden" filter="url(#navy-wordmark)">
    <image href="data:image/png;base64," x="0" y="0" width="1200" height="800"/>
  </svg>

  <!-- Healthcare descriptor. -->
  <rect x="380" y="280" width="510" height="86" rx="43" fill="#DDF4F0"/>
  <circle cx="426" cy="323" r="9" fill="#11A79D"/>
  <text x="462" y="339" fill="#0E2431" font-family="Inter, Arial, sans-serif" font-size="43" font-weight="600" letter-spacing="9">HEALTHCARE</text>
</svg>
